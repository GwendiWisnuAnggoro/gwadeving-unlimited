name: Build and Release (Android & Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. BUILD ANDROID (APK TWA via Bubblewrap)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Resmi
        uses: android-actions/setup-android@v3

      - name: Ensure Build Tools Tersedia
        run: |
          sdkmanager "build-tools;34.0.0"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap (Format Satu Baris)
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Generate Keystore & Inject Manifest
        run: |
          # Buat keystore dengan password baru
          keytool -genkey -v -keystore android.keystore \
            -alias android -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass GwadevingAppPass -keypass GwadevingAppPass \
            -dname "CN=Gwadeving, OU=Cloud, O=Gwadeving, L=Solo, S=CentralJava, C=ID"

          # Sisipkan kunci otomatis ke dalam file twa-manifest.json
          node -e "
            const fs = require('fs');
            const manifestPath = 'twa-manifest.json';
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.signingKey = {
              path: '${GITHUB_WORKSPACE}/android.keystore',
              alias: 'android'
            };
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));
          "

      - name: Build Android APK
        run: |
          # HANYA kirimkan tepat satu kali jawaban "no" agar tidak terjebak infinite loop
          echo "no" | bubblewrap build \
            --skipPwaValidation \
            --keyStorePath="${GITHUB_WORKSPACE}/android.keystore" \
            --keyStorePassword="GwadevingAppPass" \
            --keyPassword="GwadevingAppPass"

      - name: Cari File APK Hasil Build
        id: find_apk
        run: |
          mkdir -p output-android
          find . -maxdepth 3 -name "*.apk" -exec cp {} output-android/ \;
          ls -la output-android/

      - name: Upload APK sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gwadeving-Cloud-Android
          path: output-android/*.apk
          if-no-files-found: error

  # ==========================================
  # 2. BUILD WINDOWS (EXE via Tauri)
  # ==========================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri App (Jika ada)
        id: tauri_build
        shell: bash
        run: |
          if [ -d "src-tauri" ]; then
            npm install
            npx @tauri-apps/cli build
            mkdir -p output-windows
            find src-tauri/target/release/bundle -name "*.exe" -o -name "*.msi" -exec cp {} output-windows/ \;
            echo "has_bundle=true" >> $GITHUB_OUTPUT
          else
            echo "Folder src-tauri belum ditemukan. Lewati build EXE."
            echo "has_bundle=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Windows Bundle
        if: steps.tauri_build.outputs.has_bundle == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Gwadeving-Cloud-Windows
          path: output-windows/*
          if-no-files-found: warn

  # ==========================================
  # 3. CREATE GITHUB RELEASE
  # ==========================================
  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: always() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Siapkan Berkas Rilis
        run: |
          mkdir -p final-assets
          find release-assets/ -type f \( -name "*.apk" -o -name "*.exe" -o -name "*.msi" \) -exec cp {} final-assets/ \;
          ls -la final-assets/

      - name: Publish Release ke GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: final-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
